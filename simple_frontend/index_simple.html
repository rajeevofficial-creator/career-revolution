<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Revolution - Simple Login Test</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-top: 50px;
        }
        
        .container {
            max-width: 800px;
        }
        
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .btn-primary {
            background-color: #4361ee;
            border-color: #4361ee;
        }
        
        .btn-primary:hover {
            background-color: #3a0ca3;
            border-color: #3a0ca3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mb-5">
            <h1 class="text-white display-4">Career Revolution</h1>
            <p class="lead text-white">AI-Powered Career Portal</p>
        </div>
        
        <div class="card p-5">
            <h2 class="text-center mb-4">Welcome!</h2>
            <p class="text-center mb-4">Please login or register to continue.</p>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body text-center">
                            <h3>Login</h3>
                            <p>Already have an account?</p>
                            <button class="btn btn-primary btn-lg" onclick="showLogin()">
                                <i class="fas fa-sign-in-alt"></i> Login
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-body text-center">
                            <h3>Register</h3>
                            <p>Create a new account</p>
                            <button class="btn btn-outline-primary btn-lg" onclick="showRegister()">
                                <i class="fas fa-user-plus"></i> Register
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-4 text-center">
                <div class="alert alert-info">
                    <strong>Backend Status:</strong> <span id="apiStatus">Checking...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="loginEmail" placeholder="rajeev.sharma@mail.ch" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-sign-in-alt me-2"></i>Login
                            </button>
                        </div>
                    </form>
                    <div class="text-center mt-3">
                        <p class="text-muted">Don't have an account? <a href="#" onclick="showRegister()">Register here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Register</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="registerFullName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="registerFullName" placeholder="Rajeev Sharma" required>
                        </div>
                        <div class="mb-3">
                            <label for="registerEmail" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="registerEmail" placeholder="rajeev.sharma@mail.ch" required>
                        </div>
                        <div class="mb-3">
                            <label for="registerPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="registerPassword" minlength="8" placeholder="Minimum 8 characters" required>
                        </div>
                        <div class="mb-3">
                            <label for="registerConfirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="registerConfirmPassword" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-user-plus me-2"></i>Register
                            </button>
                        </div>
                    </form>
                    <div class="text-center mt-3">
                        <p class="text-muted">Already have an account? <a href="#" onclick="showLogin()">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    
    <script>
        const API_BASE_URL = 'http://localhost:8000';
        let loginModal = null;
        let registerModal = null;
        
        // Initialize modals
        document.addEventListener('DOMContentLoaded', function() {
            loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
            registerModal = new bootstrap.Modal(document.getElementById('registerModal'));
            
            // Check API status
            checkApiStatus();
            
            // Setup form submissions
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                login(email, password);
            });
            
            document.getElementById('registerForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const fullName = document.getElementById('registerFullName').value;
                const email = document.getElementById('registerEmail').value;
                const password = document.getElementById('registerPassword').value;
                const confirmPassword = document.getElementById('registerConfirmPassword').value;
                
                if (password !== confirmPassword) {
                    alert('Passwords do not match!');
                    return;
                }
                
                register(fullName, email, password);
            });
        });
        
        // Show login modal
        function showLogin() {
            console.log('showLogin called');
            if (loginModal) {
                loginModal.show();
            } else {
                alert('Login modal not initialized');
            }
        }
        
        // Show register modal
        function showRegister() {
            console.log('showRegister called');
            if (registerModal) {
                registerModal.show();
            } else {
                alert('Register modal not initialized');
            }
        }
        
        // Check API status
        async function checkApiStatus() {
            try {
                const response = await fetch(`${API_BASE_URL}/`);
                if (response.ok) {
                    document.getElementById('apiStatus').innerHTML = '<span class="text-success">✅ Connected</span>';
                } else {
                    document.getElementById('apiStatus').innerHTML = '<span class="text-danger">❌ Offline</span>';
                }
            } catch (error) {
                document.getElementById('apiStatus').innerHTML = '<span class="text-danger">❌ Error: ' + error.message + '</span>';
            }
        }
        
        // Login function
        async function login(email, password) {
            try {
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);
                
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Login failed');
                }
                
                const data = await response.json();
                alert('Login successful! Token: ' + data.access_token.substring(0, 20) + '...');
                loginModal.hide();
                
            } catch (error) {
                alert('Login error: ' + error.message);
            }
        }
        
        // Register function
        async function register(fullName, email, password) {
            try {
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        full_name: fullName
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Registration failed');
                }
                
                const data = await response.json();
                alert('Registration successful! Please check your email for verification. User ID: ' + data.id);
                registerModal.hide();
                showLogin();
                
            } catch (error) {
                alert('Registration error: ' + error.message);
            }
        }
        
        // Make functions globally available
        window.showLogin = showLogin;
        window.showRegister = showRegister;
    </script>
</body>
</html>
